<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Game Main Menu</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="main-menu" class="screen">
        <h1>RPG Game</h1>
        <button id="start-button">Start Game</button>
        <button id="options-button">Options</button>
        <button id="quit-button">Quit</button>
    </div>

    <div id="options-menu" class="screen">
        <h1>Options</h1>
        <div class="slider-container">
            <label for="music-slider">Music Volume</label>
            <input type="range" id="music-slider" min="0" max="100" value="50">
            <span id="music-volume">50%</span>
        </div>
        <div class="slider-container">
            <label for="sfx-slider">SFX Volume</label>
            <input type="range" id="sfx-slider" min="0" max="100" value="50">
            <span id="sfx-volume">50%</span>
        </div>
        <button id="back-button">Back</button>
        <button id="resolution-button">Resolution: 800x600</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
